        <form class="get-in-form">
            <h1>ADD MY PROJECT</h1>
            <br>
            <div class="mb-3">
                <label for="formGroupExampleEmail" class="form-label">Email</label>
                <input type="text" class="form-control" id="email">
            </div>
            <div class="date-form">
                <div class="mb-4">
                    <label for="formGroupExampleEmail" class="form-label">Start Date</label>
                    <input type="date" name="" class="form-control 1" id="start">

                <div class="mb-4">

                    <input type="date" name="" class="form-control 1" id="end">
                </div>
            </div>
            <div class="mb-3">
                <label for="exampleFormControlTextarea1" class="form-label">Description</label>

            </div>
            <div class="check-form">
                <label for="formGroupExampleInput" class="form-label">Technologies</label>
                <div class="check-b">
                    <div class="mb-5">
                        <input type="checkbox" name="oh" id="node" value="Node JS">

                    </div>
                    <div class="mb-5">
                        <input type="checkbox" name="oh" id="next" value="Next JS">

                    </div>
                </div>
                <div class="check-b">
                    <div class="mb-5">
                        <input type="checkbox" name="oh" id="react" value="React JS">

                    </div>
                    <div class="mb-5">
                        <input type="checkbox" name="oh" id="tysc" value="TypeScript">

                    </div>
                </div>   
            </div>
            <div class="mb-3">

                    <label for="formFileMultiple" class="form-label">Upload Image</label>
                    <input class="form-control" type="file" id="image" multiple>
